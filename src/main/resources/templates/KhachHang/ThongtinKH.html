<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Khách Hàng - CotiT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary-color: #000000; --accent-color: #2563eb; --bg-gray: #f8fafc; }
    body { background-color: var(--bg-gray); font-family: 'Inter', sans-serif; color: #1e293b; }
    .card-profile { border: none; border-radius: 20px; background: #ffffff; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); overflow: hidden; }
    .profile-header { background: var(--primary-color); padding: 40px 30px; color: white; position: relative; }

    /* Address Item Styles */
    .address-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 12px; background: white; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
    .address-item.is-default { border-color: var(--accent-color); background-color: #f0f7ff; border-width: 2px; }
    .address-icon { background: #f1f5f9; color: #64748b; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .address-item.is-default .address-icon { background: var(--accent-color); color: white; }

    .address-text { flex-grow: 1; font-size: 0.95rem; color: #334155; line-height: 1.5; }
    .badge-default { background-color: #dcfce7; color: #166534; font-size: 0.7rem; padding: 4px 10px; border-radius: 6px; font-weight: 700; text-transform: uppercase; display: inline-flex; align-items: center; }
    .btn-set-default { font-size: 0.75rem; color: var(--accent-color); background: white; border: 1px solid var(--accent-color); padding: 4px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: 600; margin-top: 5px; }
    .btn-set-default:hover { background: var(--accent-color); color: white; }

    .info-group { padding: 25px; border-bottom: 1px solid #f1f5f9; }
    .label-custom { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .value-custom { font-size: 1rem; font-weight: 500; color: #0f172a; }
    .btn-add { border-radius: 10px; padding: 8px 20px; font-weight: 600; border: none; }
    .delete-link { padding: 8px; color: #ef4444; transition: 0.2s; }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card card-profile">
        <div class="profile-header">
          <div class="d-flex align-items-center gap-3">
            <div class="bg-white rounded-circle d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
              <i class="fas fa-user text-dark fa-2x"></i>
            </div>
            <div>
              <h4 class="fw-bold mb-0" th:text="${khachHang.tenKhachHang}">Tên khách hàng</h4>
              <p class="mb-0 opacity-75 small">Quản lý địa chỉ giao hàng</p>
            </div>
          </div>
        </div>

        <div class="p-4">
          <div class="row g-0">
            <div class="col-sm-6 info-group">
              <div class="label-custom">Mã khách hàng</div>
              <div class="value-custom" th:text="${khachHang.maKhachHang}">Mã khách hàng</div>
            </div>
            <div class="col-sm-6 info-group">
              <div class="label-custom">Email</div>
              <div class="value-custom" th:text="${khachHang.email}">Email</div>
            </div>
          </div>

          <div class="mt-5 px-2">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h5 class="fw-bold mb-0">Địa chỉ giao hàng</h5>
              <button class="btn btn-primary btn-add" data-bs-toggle="modal" data-bs-target="#modalAdd">
                <i class="fas fa-plus me-2"></i>Thêm địa chỉ mới
              </button>
            </div>

            <div th:if="${not #lists.isEmpty(listDiaChi)}">
              <div th:each="dc : ${listDiaChi}"
                   class="address-item"
                   th:classappend="${dc.trangThai == 1} ? 'is-default' : ''">

                <div class="address-icon">
                  <i th:class="${dc.trangThai == 1} ? 'fas fa-star text-warning' : 'fas fa-map-marker-alt'"></i>
                </div>

                <div class="address-text">
                  <div class="d-flex align-items-center flex-wrap gap-2 mb-1">
                    <span class="fw-medium" th:text="${dc.diaChi}">Địa chỉ</span>

                    <span th:if="${dc.trangThai == 1}" class="badge-default">
                                            <i class="fas fa-check-circle me-1"></i>Mặc định
                                        </span>
                  </div>

                  <button th:if="${dc.trangThai != 1}"
                          th:onclick="'datMacDinh(' + ${dc.id} + ')'"
                          class="btn-set-default">
                    Sử dụng làm mặc định
                  </button>
                </div>

                <a th:href="@{'/khach-hang/dia-chi/delete/' + ${dc.id}}"
                   class="delete-link"
                   onclick="return confirm('Xóa địa chỉ này?')">
                  <i class="fas fa-trash-alt"></i>
                </a>
              </div>
            </div>

            <div th:if="${#lists.isEmpty(listDiaChi)}" class="text-center py-5">
              <p class="text-muted">Bạn chưa lưu địa chỉ nào.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalAdd" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4">
      <div class="modal-header border-0"><h5 class="fw-bold">Thêm địa chỉ mới</h5></div>
      <form th:action="@{/khach-hang/dia-chi/add}" method="post">
        <div class="modal-body p-4 pt-0">
          <textarea class="form-control" name="diaChi" rows="3" placeholder="Nhập địa chỉ..." required></textarea>
        </div>
        <div class="modal-footer border-0">
          <button type="submit" class="btn btn-primary w-100 py-2">Lưu địa chỉ</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  function datMacDinh(idDiaChi) {
    $.ajax({
      url: '/khach-hang/dat-dia-chi-mac-dinh/' + idDiaChi,
      type: 'POST',
      success: function() {
        window.location.reload();
      },
      error: function() {
        alert('Có lỗi xảy ra khi cập nhật!');
      }
    });
  }
</script>
</body>
</html>
