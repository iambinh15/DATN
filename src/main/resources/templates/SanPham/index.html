<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card-custom {
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
        }

        .table th {
            vertical-align: middle;
        }

        .table-hover tbody tr:hover {
            background-color: #f1f5ff;
            transition: 0.2s;
        }

        .badge-status {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 20px;
        }

        .btn-sm {
            border-radius: 20px;
            padding: 4px 12px;
        }

        .action-buttons .btn {
            margin-bottom: 5px;
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">
            <i class="bi bi-box-seam"></i> Quản lý sản phẩm
        </h2>

        <a th:href="@{/admin/san-pham/create}" class="btn btn-primary shadow-sm">
            <i class="bi bi-plus-circle"></i> Thêm sản phẩm
        </a>
    </div>

    <!-- Card -->
    <div class="card card-custom shadow">

        <div class="card-header card-header-custom">
            <h5 class="mb-0">
                <i class="bi bi-list-ul"></i> Danh sách sản phẩm
            </h5>
        </div>

        <div class="card-body p-0">

            <table class="table table-hover mb-0">
                <thead class="table-light text-center">
                <tr>
                    <th width="80">ID</th>
                    <th>Tên sản phẩm</th>
                    <th width="150">Trạng thái</th>
                    <th width="180">Hành động</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="sp : ${list}">
                    <td class="text-center fw-semibold"
                        th:text="${sp.id}"></td>

                    <td class="fw-medium"
                        th:text="${sp.tenSanPham}"></td>

                    <td class="text-center">
                        <span th:if="${sp.trangThai == 1}"
                              class="badge bg-success badge-status">
                            <i class="bi bi-check-circle"></i> Đang bán
                        </span>

                        <span th:if="${sp.trangThai != 1}"
                              class="badge bg-secondary badge-status">
                            <i class="bi bi-pause-circle"></i> Ngừng bán
                        </span>
                    </td>

                    <td class="action-buttons text-center">
                        <a th:href="@{/admin/spct/create/{id}(id=${sp.id})}"
                           class="btn btn-success btn-sm">
                            <i class="bi bi-plus"></i> Chi tiết
                        </a>

                        <a th:href="@{/admin/san-pham/delete/{id}(id=${sp.id})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('Bạn có chắc muốn xóa?')">
                            <i class="bi bi-trash"></i> Xóa
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(list)}">
                    <td colspan="4" class="text-center py-4 text-muted">
                        <i class="bi bi-exclamation-circle"></i>
                        Chưa có sản phẩm nào
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
