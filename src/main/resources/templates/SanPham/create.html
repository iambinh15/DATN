<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm - CotiT Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
            color: #111;
            line-height: 1.6;
        }

        /* ===== LAYOUT ===== */
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: #000;
            color: #fff;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid #222;
        }

        .sidebar-logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo span {
            font-size: 12px;
            font-weight: 400;
            background: #333;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .sidebar-nav {
            padding: 20px 0;
        }

        .nav-section {
            margin-bottom: 20px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #666;
            padding: 0 20px;
            margin-bottom: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #999;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: #111;
            color: #fff;
        }

        .nav-item.active {
            background: #111;
            color: #fff;
            border-left-color: #fff;
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            border-top: 1px solid #222;
            background: #000;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-avatar i {
            font-size: 18px;
            color: #999;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .user-role {
            font-size: 12px;
            color: #666;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #333;
            color: #999;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 30px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
        }

        /* ===== FORM CARD ===== */
        .form-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            max-width: 700px;
        }

        .form-card-header {
            padding: 20px 25px;
            border-bottom: 1px solid #eee;
        }

        .form-card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .form-card-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #000;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-save {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-save:hover {
            background: #333;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: transparent;
            color: #666;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: #f5f5f5;
            color: #333;
            border-color: #ccc;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }

            .sidebar-header,
            .nav-section-title,
            .nav-item span,
            .user-details,
            .btn-logout span {
                display: none;
            }

            .nav-item {
                justify-content: center;
                padding: 15px;
            }

            .nav-item i {
                font-size: 20px;
            }

            .main-content {
                margin-left: 80px;
            }
        }
    </style>
</head>

<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/admin" class="sidebar-logo">
                    COTIT <span>ADMIN</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <p class="nav-section-title">Menu chính</p>
                    <a th:href="@{/admin}" class="nav-item">
                        <i class="fas fa-home"></i>
                        <span>Tổng quan</span>
                    </a>
                    <a th:href="@{/admin/ban-hang}" class="nav-item">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Quản lý bán hàng</span>
                    </a>
                    <a th:href="@{/hoa-don}" class="nav-item">
                        <i class="fas fa-file-invoice"></i>
                        <span>Quản lý hóa đơn</span>
                    </a>
                    <li sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin/khuyen-mai}" class="nav-item">
                            <i class="fas fa-ticket-alt"></i>
                            <span>Quản lý voucher</span>
                        </a>
                    </li>
                    <a th:href="@{/thong-ke}" class="nav-item">
                        <i class="fas fa-chart-bar"></i>
                        <span>Thống kê</span>
                    </a>
                </div>

                <div class="nav-section">
                    <p class="nav-section-title">Quản lý</p>
                    <a th:href="@{/khach-hang}" class="nav-item">
                        <i class="fas fa-users"></i>
                        <span>Quản lý khách hàng</span>
                    </a>
                    <li sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/nhan-vien}" class="nav-item">
                            <i class="fas fa-user-tie"></i>
                            <span>Quản lý nhân viên</span>
                        </a>
                    </li>
                </div>

                <div class="nav-section">
                    <li sec:authorize="hasRole('ADMIN')">
                        <p class="nav-section-title">Sản phẩm</p>
                        <a th:href="@{/admin/san-pham}" class="nav-item active">
                            <i class="fas fa-box"></i>
                            <span>Danh sách sản phẩm</span>
                        </a>
                    </li>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <p class="user-name" th:text="${session.tenNhanVien != null ? session.tenNhanVien : 'Admin'}">
                            Admin</p>
                        <p class="user-role">Quản trị viên</p>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn-logout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Đăng xuất</span>
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1 class="page-title">Thêm sản phẩm</h1>
            </div>

            <!-- Form Card -->
            <div class="form-card">
                <div class="form-card-header">
                    <h3 class="form-card-title"><i class="fas fa-plus-circle"></i> Thông tin sản phẩm</h3>
                </div>
                <div class="form-card-body">
                    <form th:action="@{/admin/san-pham/save}"
                          th:object="${sanPham}"
                          method="post"
                          enctype="multipart/form-data">

                        <!-- Ẩn ID để khi sửa không tạo bản ghi mới -->
                        <input type="hidden" th:field="*{id}"/>

                        <div class="form-group">
                            <label>Mã sản phẩm *</label>
                            <input type="text" th:field="*{maSanPham}" placeholder="Nhập mã sản phẩm" required>
                        </div>

                        <div class="form-group">
                            <label>Tên sản phẩm *</label>
                            <input type="text" th:field="*{tenSanPham}" placeholder="Nhập tên sản phẩm" required>
                        </div>

                        <div class="form-group">
                            <label>Mô tả</label>
                            <textarea th:field="*{moTa}" placeholder="Nhập mô tả sản phẩm"></textarea>
                        </div>

                        <div class="form-group">
                            <label>Ảnh sản phẩm</label>
                            <input type="file"
                                   name="imageFile"
                                   accept="image/*">
                        </div>

                        <div class="form-group">
                            <label>Thương hiệu *</label>
                            <select th:field="*{idThuongHieu}" required>
                                <option value="">-- Chọn thương hiệu --</option>
                                <option th:each="th : ${listThuongHieu}" th:value="${th.id}"
                                    th:text="${th.tenThuongHieu}">
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Trạng thái</label>
                            <select th:field="*{trangThai}">
                                <option value="1">Hoạt động</option>
                                <option value="0">Ngừng hoạt động</option>
                            </select>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-save">
                                <i class="fas fa-save"></i> Lưu sản phẩm
                            </button>
                            <a th:href="@{/admin/san-pham}" class="btn-back">
                                <i class="fas fa-arrow-left"></i> Quay lại
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
