<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h3 class="text-center mb-4 text-primary">Thêm sản phẩm</h3>

        <!-- ACTION PHẢI ĐÚNG CONTROLLER -->
        <form th:action="@{/admin/san-pham/save}"
              th:object="${sanPham}"
              method="post">

            <!-- Mã sản phẩm -->
            <div class="mb-3">
                <label class="form-label fw-bold">Mã sản phẩm *</label>
                <input type="text"
                       class="form-control"
                       th:field="*{maSanPham}"
                       placeholder="Nhập mã sản phẩm"
                       required>
            </div>

            <!-- Tên sản phẩm -->
            <div class="mb-3">
                <label class="form-label fw-bold">Tên sản phẩm *</label>
                <input type="text"
                       class="form-control"
                       th:field="*{tenSanPham}"
                       placeholder="Nhập tên sản phẩm"
                       required>
            </div>

            <!-- Mô tả -->
            <div class="mb-3">
                <label class="form-label fw-bold">Mô tả</label>
                <textarea class="form-control"
                          rows="3"
                          th:field="*{moTa}"
                          placeholder="Nhập mô tả sản phẩm"></textarea>
            </div>

            <!-- Thương hiệu -->
            <div class="mb-3">
                <label class="form-label fw-bold">Thương hiệu *</label>
                <!-- QUAN TRỌNG: tên phải trùng với entity -->
                <select class="form-select"
                        th:field="*{idThuongHieu}"
                        required>

                    <option value="">-- Chọn thương hiệu --</option>

                    <option th:each="th : ${listThuongHieu}"
                            th:value="${th.id}"
                            th:text="${th.tenThuongHieu}">
                    </option>
                </select>
            </div>

            <!-- Trạng thái -->
            <div class="mb-3">
                <label class="form-label fw-bold">Trạng thái</label>
                <select class="form-select" th:field="*{trangThai}">
                    <option value="1">Hoạt động</option>
                    <option value="0">Ngừng hoạt động</option>
                </select>
            </div>

            <!-- Buttons -->
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success px-4">
                    Lưu
                </button>

                <a th:href="@{/admin/san-pham}"
                   class="btn btn-secondary px-4">
                    Quay lại
                </a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
