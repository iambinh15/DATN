<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thống kê</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4 text-primary">📊 Thống kê doanh thu</h2>

    <!-- ================= BỘ LỌC ================= -->

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form method="get" th:action="@{/thong-ke}">
                <div class="row g-3 align-items-end">

                    <div class="col-md-3">
                        <label>Từ ngày</label>
                        <input type="datetime-local"
                               name="tuNgay"
                               class="form-control"
                               th:value="${tuNgay}">
                    </div>

                    <div class="col-md-3">
                        <label>Đến ngày</label>
                        <input type="datetime-local"
                               name="denNgay"
                               class="form-control"
                               th:value="${denNgay}">
                    </div>

                    <div class="col-md-3">
                        <button class="btn btn-primary w-100">
                            🔍 Lọc
                        </button>
                    </div>

                    <div class="col-md-3 text-end">
                        <a th:href="@{/thong-ke(export=true)}"
                           class="btn btn-success w-100">
                            ⬇ Xuất Excel
                        </a>
                    </div>

                </div>
            </form>

            <hr>

            <div class="d-flex gap-2 flex-wrap">
                <a th:href="@{/thong-ke(type='today')}"
                   class="btn btn-outline-primary btn-sm">Hôm nay</a>

                <a th:href="@{/thong-ke(type='7days')}"
                   class="btn btn-outline-primary btn-sm">7 ngày</a>

                <a th:href="@{/thong-ke(type='month')}"
                   class="btn btn-outline-primary btn-sm">Tháng này</a>

                <a th:href="@{/thong-ke(type='year')}"
                   class="btn btn-outline-primary btn-sm">Năm</a>
            </div>

        </div>
    </div>

    <!-- ================= TỔNG DOANH THU ================= -->

    <div class="card shadow-sm mb-4">
        <div class="card-body text-center">
            <h4>Tổng doanh thu</h4>

            <h2 class="text-danger fw-bold"
                th:text="${#numbers.formatDecimal(doanhThu,0,'COMMA',0,'POINT')} + ' đ'">
            </h2>
        </div>
    </div>

    <!-- ================= BIỂU ĐỒ 12 THÁNG ================= -->

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="mb-3">Doanh thu 12 tháng</h5>
            <canvas id="chart"></canvas>
        </div>
    </div>

    <!-- ================= TOP SẢN PHẨM ================= -->

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <h5 class="mb-3">🔥 Top sản phẩm bán chạy</h5>

            <table class="table table-bordered table-hover">
                <thead class="table-warning">
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Số lượng bán</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sp : ${topSanPham}">
                    <td th:text="${sp[0]}"></td>
                    <td class="fw-bold text-primary"
                        th:text="${sp[1]}"></td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

    <!-- ================= SẢN PHẨM SẮP HẾT ================= -->

    <div class="card shadow-sm mb-4 border-danger">
        <div class="card-body">

            <h5 class="text-danger mb-3">
                ⚠ Sản phẩm sắp hết hàng
                (<span th:text="${soLuongSapHet}"></span> sản phẩm)
            </h5>

            <table class="table table-bordered table-hover">
                <thead class="table-danger">
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Màu</th>
                    <th>Size</th>
                    <th>Chất liệu</th>
                    <th>Số lượng</th>
                    <th>Đơn giá</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="sp : ${sapHetHang}"
                    th:classappend="${sp.soLuong < 10} ? 'table-danger'">

                    <!-- ĐÚNG FIELD ENTITY CỦA BẠN -->

                    <td th:text="${sp.idSanPham != null ? sp.idSanPham.tenSanPham : ''}"></td>

                    <td th:text="${sp.idMauSac != null ? sp.idMauSac.tenMau : ''}"></td>

                    <td th:text="${sp.idSize != null ? sp.idSize.tenSize : ''}"></td>

                    <td th:text="${sp.idChatLieu != null ? sp.idChatLieu.tenChatLieu : ''}"></td>

                    <td class="fw-bold text-danger"
                        th:text="${sp.soLuong}"></td>

                    <td th:text="${#numbers.formatDecimal(sp.donGia,0,'COMMA',0,'POINT')} + ' đ'"></td>

                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<!-- ================= CHART JS ================= -->

<script th:inline="javascript">
    let data = [[${dataThang}]];

    new Chart(document.getElementById('chart'), {
        type: 'bar',
        data: {
            labels: [
                "T1","T2","T3","T4","T5","T6",
                "T7","T8","T9","T10","T11","T12"
            ],
            datasets: [{
                label: "Doanh thu",
                data: data
            }]
        }
    });
</script>

</body>
</html>
