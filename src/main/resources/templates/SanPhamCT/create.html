<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm biến thể sản phẩm</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #f4f6f9;
        }

        .container {
            width: 700px;
            margin: 40px auto;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .error-box {
            background: #ffe3e3;
            color: #c92a2a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        .btn-group {
            text-align: center;
            margin-top: 25px;
        }

        .btn {
            padding: 9px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-back {
            background: #6c757d;
            color: white;
            text-decoration: none;
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2>Thêm biến thể sản phẩm</h2>

        <div th:if="${error}" class="error-box" th:text="${error}"></div>

        <form th:action="@{/admin/spct/save}"
              th:object="${spct}"
              method="post">

            <!-- Giữ id sản phẩm -->
            <input type="hidden" th:field="*{idSanPham.id}" />

            <div class="row">

                <div class="form-group col">
                    <label>Màu sắc *</label>
                    <select th:field="*{idMauSac.id}" required>
                        <option value="">-- Chọn màu --</option>
                        <option th:each="m : ${mauSacs}"
                                th:value="${m.id}"
                                th:text="${m.tenMau}">
                        </option>
                    </select>
                </div>

                <div class="form-group col">
                    <label>Size *</label>
                    <select th:field="*{idSize.id}" required>
                        <option value="">-- Chọn size --</option>
                        <option th:each="s : ${sizes}"
                                th:value="${s.id}"
                                th:text="${s.tenSize}">
                        </option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label>Chất liệu</label>
                <select th:field="*{idChatLieu.id}">
                    <option value="">-- Chọn chất liệu --</option>
                    <option th:each="c : ${chatLieus}"
                            th:value="${c.id}"
                            th:text="${c.tenChatLieu}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Giá bán *</label>
                <input type="number"
                       th:field="*{donGia}"
                       min="0"
                       step="0.01"
                       required>
            </div>

            <div class="form-group">
                <label>Số lượng *</label>
                <input type="number"
                       th:field="*{soLuong}"
                       min="1"
                       required>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-save">Lưu</button>

                <a th:href="@{/admin/spct/list/{id}(id=${spct.idSanPham.id})}"
                   class="btn btn-back">
                    Quay lại
                </a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
